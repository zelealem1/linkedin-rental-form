<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Submit LinkedIn Offer
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            LinkedIn Account Offer
        </h1>

        <p>
            Submit your account details
            for review.
        </p>

    </div>


    <form id="offerForm">


        <!-- CONNECTION TIER -->

        <div class="form-group">

            <label for="tier">
                Connection Tier
            </label>

            <select
                id="tier"
                required
            >

                <option value="">
                    Select tier
                </option>

                <option value="100">
                    100+ connections — $5/week
                </option>

                <option value="300">
                    300+ connections — $7/week
                </option>

                <option value="500">
                    500+ connections — $13/week
                </option>

                <option value="1000">
                    1000+ connections — $16/week
                </option>

                <option value="2000">
                    2000+ connections — $20/week
                </option>

                <option value="3000">
                    3000+ connections — $25/week
                </option>

            </select>

        </div>


        <!-- CREATION DATE -->

        <div class="form-group">

            <label
                for="creation_date"
            >
                Account Creation Date
            </label>

            <input
                type="date"
                id="creation_date"
                required
            >

        </div>


        <!-- PROFILE NAME -->

        <div class="form-group">

            <label
                for="profile_name"
            >
                Profile Name
            </label>

            <input
                type="text"
                id="profile_name"
                placeholder="Enter profile name"
                required
            >

        </div>


        <!-- PROFILE URL -->

        <div class="form-group">

            <label
                for="profile_url"
            >
                LinkedIn Profile URL
            </label>

            <input
                type="url"
                id="profile_url"
                placeholder="https://www.linkedin.com/in/..."
                required
            >

        </div>


        <!-- PAYMENT METHOD -->

        <div class="form-group">

            <label
                for="payment_method"
            >
                Payment Method
            </label>

            <select
                id="payment_method"
                required
            >

                <option value="">
                    Select payment method
                </option>

                <option value="Bank Transfer">
                    Bank Transfer
                </option>

                <option value="PayPal">
                    PayPal
                </option>

                <option value="Mobile Money">
                    Mobile Money
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- PAYMENT ACCOUNT -->

        <div class="form-group">

            <label
                for="payment_account"
            >
                Payment Account
            </label>

            <input
                type="text"
                id="payment_account"
                placeholder="Enter payment details"
                required
            >

        </div>


        <!-- OWNER NAME -->

        <div class="form-group">

            <label
                for="owner_name"
            >
                Account Owner Name
            </label>

            <input
                type="text"
                id="owner_name"
                placeholder="Enter your name"
                required
            >

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            id="submitButton"
        >
            Submit Offer
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>

</div>


<!-- TELEGRAM WEB APP -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="script.js"></script>

</body>

</html>
